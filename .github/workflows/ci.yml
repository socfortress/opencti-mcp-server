name: CI

# Lint and tests. The container image is built and checked on pull requests, and published from v*
# tags, by publish.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      # Live tests are deselected by default (-m "not live") and also skip without OPENCTI_LIVE=1.
      - run: uv run pytest -q
