# Publish the container image to GHCR. SOCFortress clients' talon-analyst installs pull it:
#
#   ghcr.io/socfortress/opencti-mcp-server
#
# Tags: X.Y.Z from a vX.Y.Z tag, sha-<full commit SHA>, and `latest` on a plain vX.Y.Z tag only.
# linux/amd64 and linux/arm64, with SBOM and provenance attestations.
#
# - push of a v* tag: check the ref, test, check the image, then build and push. The tag's commit must be on origin/main's
#   history and the tag must match pyproject.toml's version.
# - workflow_dispatch: from a v* tag only; any other ref fails.
# - pull_request: build-only on linux/amd64 and check; nothing is pushed and there is no registry login.
# - Publishing runs in the `release` environment, whose required reviewers approve it, and v* tags are
#   protected by a tag ruleset (repo settings, applied by an admin).
#
# Before anything is pushed, scripts/check_image.sh checks the image on both platforms: the non-root
# user, the server imports, and no secrets, .env files, tests or other repo files. A new GHCR package
# starts private: an org owner makes it public once. Actions are pinned by commit SHA; the comment
# names the release. Modelled on talon-analyst's release-images workflow.

name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/socfortress/opencti-mcp-server

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (linux/amd64, not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: opencti-mcp-server:check
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the image
        run: scripts/check_image.sh opencti-mcp-server:check linux/amd64

  # Ref checks and tests, before the release environment asks anyone to approve.
  check:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      latest: ${{ steps.release.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # origin/main's history, for the ancestor check
      - id: release
        name: Only a release tag on main's history, matching pyproject.toml
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$EVENT:$REF" in
            push:refs/tags/v* | workflow_dispatch:refs/tags/v*) ;;
            *) echo "::error::publishing runs only from a v* tag, not $EVENT on $REF"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on origin/main's history: tag a merged commit"
            exit 1
          fi
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$REF_NAME" != "v$version" ]; then
            echo "::error::tag $REF_NAME does not match pyproject.toml's version $version (expected v$version)"
            exit 1
          fi
          # `latest` only for a plain release tag vX.Y.Z (no pre-release or build suffix).
          if printf '%s' "$REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      - run: uv sync --frozen
      - run: uv run ruff check src scripts tests
      - run: uv run ruff format --check src scripts tests
      # Live tests are deselected by default (-m "not live") and also skip without OPENCTI_LIVE=1.
      - run: uv run pytest -q

  publish:
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Only this job can write packages.
    permissions:
      contents: read
      packages: write
    # Required reviewers on this environment gate every publish (a repo setting, applied by an admin).
    environment: release
    env:
      # OCI annotations on the multi-arch index too, where GHCR reads the description and source.
      DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Each platform is built and checked before anything is pushed; the push below reuses both
      # builds from the builder's cache.
      - name: Build linux/amd64 for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: opencti-mcp-server:check-amd64
          cache-from: type=gha
      - name: Check the image (linux/amd64)
        run: scripts/check_image.sh opencti-mcp-server:check-amd64 linux/amd64
      - name: Build linux/arm64 for the check
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: opencti-mcp-server:check-arm64
          cache-from: type=gha
      - name: Check the image (linux/arm64, under QEMU)
        run: scripts/check_image.sh opencti-mcp-server:check-arm64 linux/arm64
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable=${{ needs.check.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=opencti-mcp-server
            org.opencontainers.image.description=Read-only MCP server for OpenCTI, for talon-analyst
            org.opencontainers.image.vendor=SOCFortress
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=opencti-mcp-server
            org.opencontainers.image.description=Read-only MCP server for OpenCTI, for talon-analyst
            org.opencontainers.image.vendor=SOCFortress
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### $IMAGE"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "$TAGS" | while read -r tag; do printf -- '- %s\n' "$tag"; done
          } >> "$GITHUB_STEP_SUMMARY"
