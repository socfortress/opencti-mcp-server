[project]
name = "opencti-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for OpenCTI, for talon-analyst"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.*",
    "pydantic==2.*",
    "pydantic-settings==2.*",
    "starlette",
    "uvicorn",
]

[project.scripts]
opencti-mcp-server = "opencti_mcp_server.__main__:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.9", "graphql-core>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opencti_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: read-only checks against a live OpenCTI (OPENCTI_LIVE=1 with OPENCTI_URL and OPENCTI_TOKEN)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"
